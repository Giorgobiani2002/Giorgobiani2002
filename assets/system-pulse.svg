<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Lasha Giorgobiani, AI Engineer and Full Stack Software Engineer</title>
  <desc id="description">An animated AI product system showing interfaces, agents, APIs, queues, data, and production delivery.</desc>

  <defs>
    <linearGradient id="surfaceGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--surface-glow-start)" />
      <stop offset="1" stop-color="var(--surface-glow-end)" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="var(--accent-cool)" stop-opacity="0" />
      <stop offset="0.42" stop-color="var(--accent-cool)" />
      <stop offset="1" stop-color="var(--accent-warm)" />
    </linearGradient>
    <radialGradient id="ambient" cx="77%" cy="40%" r="54%">
      <stop offset="0" stop-color="var(--ambient)" stop-opacity="0.18" />
      <stop offset="1" stop-color="var(--ambient)" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="var(--grid)" stroke-width="1" />
    </pattern>
    <filter id="softGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="var(--shadow)" flood-opacity="0.24" />
    </filter>

    <path id="flowClientApi" d="M 828 104 C 858 104 862 146 895 146" />
    <path id="flowApiQueue" d="M 975 146 C 1004 146 1004 205 1033 205" />
    <path id="flowQueueData" d="M 1109 205 C 1140 205 1140 268 1110 268" />
    <path id="flowDataApi" d="M 1035 268 C 954 268 938 220 938 184" />
    <path id="flowApiDeploy" d="M 938 108 C 938 74 1003 62 1060 62" />
  </defs>

  <style>
    :root {
      --bg: #0d1117;
      --surface: #121923;
      --surface-strong: #172231;
      --surface-glow-start: #14202d;
      --surface-glow-end: #0f151d;
      --border: #2a3543;
      --border-soft: #202a35;
      --grid: #263240;
      --text: #f0f4f8;
      --text-soft: #aab6c4;
      --text-dim: #718095;
      --accent-cool: #59c7b2;
      --accent-blue: #78a9ff;
      --accent-warm: #f2aa4c;
      --ambient: #5d9cec;
      --shadow: #000000;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --surface-strong: #eef3f8;
        --surface-glow-start: #ffffff;
        --surface-glow-end: #edf2f7;
        --border: #c9d3df;
        --border-soft: #d8e0e8;
        --grid: #d8e0e8;
        --text: #17202a;
        --text-soft: #526272;
        --text-dim: #778899;
        --accent-cool: #168a78;
        --accent-blue: #3677c8;
        --accent-warm: #b66a08;
        --ambient: #6b9dd6;
        --shadow: #47627c;
      }
    }

    * { box-sizing: border-box; }
    text { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .eyebrow { fill: var(--text-dim); font-size: 12px; font-weight: 650; letter-spacing: 2.3px; }
    .name { fill: var(--text); font-size: 55px; font-weight: 720; letter-spacing: -1.8px; }
    .role { fill: var(--text-soft); font-size: 18px; font-weight: 520; letter-spacing: 0.1px; }
    .copy { fill: var(--text-soft); font-size: 14px; }
    .chip-text { fill: var(--text-soft); font-size: 11px; font-weight: 650; letter-spacing: 0.55px; }
    .node-label { fill: var(--text-dim); font-size: 9px; font-weight: 700; letter-spacing: 1.2px; }
    .node-value { fill: var(--text); font-size: 12px; font-weight: 650; }
    .node-meta { fill: var(--text-dim); font-size: 9px; }

    .grid { opacity: 0.2; animation: gridBreath 8s ease-in-out infinite; }
    .scan { animation: scanAcross 9s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
    .intro-eyebrow { opacity: 0; animation: riseIn 0.7s 0.08s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .intro-name { opacity: 0; animation: riseIn 0.9s 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .intro-role { opacity: 0; animation: riseIn 0.8s 0.34s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .intro-copy { opacity: 0; animation: riseIn 0.8s 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .intro-link { opacity: 0; animation: riseIn 0.8s 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .chip { opacity: 0; transform-box: fill-box; transform-origin: center; animation: chipIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .chip-1 { animation-delay: 0.66s; }
    .chip-2 { animation-delay: 0.75s; }
    .chip-3 { animation-delay: 0.84s; }
    .chip-4 { animation-delay: 0.93s; }

    .node { opacity: 0; transform-box: fill-box; transform-origin: center; animation: nodeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .node-client { animation-delay: 0.35s; }
    .node-api { animation-delay: 0.52s; }
    .node-queue { animation-delay: 0.68s; }
    .node-data { animation-delay: 0.84s; }
    .node-deploy { animation-delay: 1s; }
    .node-orbit { animation: orbitPulse 6s 1.4s ease-in-out infinite; }

    .flow {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 6 7;
      opacity: 0;
      animation: lineIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .flow-1 { animation-delay: 0.72s; }
    .flow-2 { animation-delay: 0.88s; }
    .flow-3 { animation-delay: 1.04s; }
    .flow-4 { animation-delay: 1.2s; }
    .flow-5 { animation-delay: 1.12s; }
    .packet { filter: url(#softGlow); }
    .packet-cool { fill: var(--accent-cool); }
    .packet-blue { fill: var(--accent-blue); }
    .packet-warm { fill: var(--accent-warm); }
    .status-dot { transform-box: fill-box; transform-origin: center; animation: statusPulse 2.4s ease-in-out infinite; }
    .cursor { animation: cursorBlink 1.1s steps(1, end) infinite; }
    .metric { opacity: 0; animation: metricIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .metric-1 { animation-delay: 1.05s; }
    .metric-2 { animation-delay: 1.18s; }
    .metric-3 { animation-delay: 1.31s; }
    .bar { transform-box: fill-box; transform-origin: left center; animation: barLoad 1.1s 1.4s cubic-bezier(0.16, 1, 0.3, 1) both; }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes chipIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes nodeIn {
      from { opacity: 0; transform: translateY(14px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes lineIn {
      from { opacity: 0; stroke-dashoffset: 42; }
      to { opacity: 1; stroke-dashoffset: 0; }
    }
    @keyframes metricIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes barLoad {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }
    @keyframes gridBreath {
      0%, 100% { opacity: 0.16; }
      50% { opacity: 0.28; }
    }
    @keyframes scanAcross {
      0%, 14% { transform: translateX(-300px); opacity: 0; }
      20% { opacity: 0.5; }
      52% { opacity: 0.25; }
      58%, 100% { transform: translateX(1380px); opacity: 0; }
    }
    @keyframes orbitPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.04); }
    }
    @keyframes statusPulse {
      0%, 100% { transform: scale(0.85); opacity: 0.62; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    @keyframes cursorBlink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .intro-eyebrow, .intro-name, .intro-role, .intro-copy, .intro-link,
      .chip, .node, .flow, .metric { opacity: 1; transform: none; }
      .bar { transform: none; opacity: 1; }
      .packet, .scan { display: none; }
      .grid { opacity: 0.2; }
    }
  </style>

  <rect width="1280" height="360" rx="20" fill="var(--bg)" />
  <rect x="1" y="1" width="1278" height="358" rx="19" fill="none" stroke="var(--border-soft)" />
  <rect width="1280" height="360" rx="20" fill="url(#ambient)" />
  <rect class="grid" x="642" width="638" height="360" fill="url(#grid)" />
  <rect class="scan" x="0" y="0" width="170" height="360" fill="url(#accentLine)" opacity="0.16" />

  <g class="intro-eyebrow">
    <circle cx="67" cy="53" r="4" fill="var(--accent-cool)" class="status-dot" />
    <text class="eyebrow mono" x="82" y="57">SYSTEM PROFILE / 01</text>
  </g>

  <g class="intro-name">
    <text class="name" x="62" y="137">Lasha Giorgobiani</text>
  </g>

  <g class="intro-role">
    <text class="role" x="64" y="178">AI Engineer &amp; Full Stack Software Engineer</text>
    <rect class="cursor" x="458" y="158" width="2" height="24" rx="1" fill="var(--accent-warm)" />
  </g>

  <g class="intro-copy">
    <text class="copy" x="64" y="218">I build AI products, automation, and the systems behind them.</text>
    <text class="copy" x="64" y="241">Agents, voice workflows, typed APIs, data, and production delivery.</text>
  </g>

  <g class="chip chip-1">
    <rect x="64" y="270" width="92" height="30" rx="8" fill="var(--surface)" stroke="var(--border)" />
    <text class="chip-text mono" x="81" y="289">AI AGENTS</text>
  </g>
  <g class="chip chip-2">
    <rect x="165" y="270" width="58" height="30" rx="8" fill="var(--surface)" stroke="var(--border)" />
    <text class="chip-text mono" x="182" y="289">N8N</text>
  </g>
  <g class="chip chip-3">
    <rect x="232" y="270" width="98" height="30" rx="8" fill="var(--surface)" stroke="var(--border)" />
    <text class="chip-text mono" x="251" y="289">TYPESCRIPT</text>
  </g>
  <g class="chip chip-4">
    <rect x="339" y="270" width="128" height="30" rx="8" fill="var(--surface)" stroke="var(--border)" />
    <text class="chip-text mono" x="357" y="289">PRODUCT SYSTEMS</text>
  </g>

  <g class="intro-link">
    <text class="node-meta mono" x="64" y="330">TBILISI, GEORGIA</text>
    <line x1="183" y1="326" x2="218" y2="326" stroke="var(--border)" />
    <text class="node-meta mono" x="230" y="330">BUILD</text>
    <circle cx="273" cy="326" r="2" fill="var(--accent-cool)" />
    <text class="node-meta mono" x="284" y="330">VALIDATE</text>
    <circle cx="352" cy="326" r="2" fill="var(--accent-blue)" />
    <text class="node-meta mono" x="363" y="330">SHIP</text>
  </g>

  <line x1="606" y1="42" x2="606" y2="318" stroke="var(--border-soft)" />
  <text class="eyebrow mono" x="666" y="57">LIVE ARCHITECTURE</text>
  <text class="node-meta mono" x="1110" y="57">MOTION / ACTIVE</text>

  <g class="flow flow-1"><use href="#flowClientApi" /></g>
  <g class="flow flow-2"><use href="#flowApiQueue" /></g>
  <g class="flow flow-3"><use href="#flowQueueData" /></g>
  <g class="flow flow-4"><use href="#flowDataApi" /></g>
  <g class="flow flow-5"><use href="#flowApiDeploy" /></g>

  <g class="packet packet-cool">
    <circle r="3.4">
      <animateMotion dur="4.4s" begin="1.4s" repeatCount="indefinite"><mpath href="#flowClientApi" /></animateMotion>
    </circle>
  </g>
  <g class="packet packet-blue">
    <circle r="3.2">
      <animateMotion dur="5.2s" begin="2.1s" repeatCount="indefinite"><mpath href="#flowApiQueue" /></animateMotion>
    </circle>
  </g>
  <g class="packet packet-warm">
    <circle r="3.5">
      <animateMotion dur="5.8s" begin="2.8s" repeatCount="indefinite"><mpath href="#flowQueueData" /></animateMotion>
    </circle>
  </g>
  <g class="packet packet-cool">
    <circle r="3">
      <animateMotion dur="6.3s" begin="3.4s" repeatCount="indefinite"><mpath href="#flowDataApi" /></animateMotion>
    </circle>
  </g>
  <g class="packet packet-warm">
    <circle r="3.4">
      <animateMotion dur="5.6s" begin="2.5s" repeatCount="indefinite"><mpath href="#flowApiDeploy" /></animateMotion>
    </circle>
  </g>

  <g class="node node-client" filter="url(#shadow)">
    <rect x="690" y="78" width="138" height="82" rx="12" fill="url(#surfaceGlow)" stroke="var(--border)" />
    <circle cx="710" cy="96" r="3" fill="var(--accent-warm)" />
    <circle cx="720" cy="96" r="3" fill="var(--accent-cool)" />
    <line x1="704" y1="112" x2="814" y2="112" stroke="var(--border-soft)" />
    <rect x="704" y="125" width="46" height="20" rx="5" fill="var(--surface-strong)" />
    <rect x="758" y="125" width="56" height="7" rx="3.5" fill="var(--border)" />
    <rect x="758" y="138" width="38" height="7" rx="3.5" fill="var(--border-soft)" />
    <text class="node-label mono" x="690" y="69">PRODUCT</text>
  </g>

  <g class="node node-api" filter="url(#shadow)">
    <rect x="895" y="108" width="80" height="76" rx="14" fill="var(--surface)" stroke="var(--border)" />
    <circle class="node-orbit" cx="935" cy="146" r="23" fill="none" stroke="var(--accent-cool)" stroke-opacity="0.45" />
    <path d="M923 146h24M935 134v24" stroke="var(--accent-cool)" stroke-width="2" stroke-linecap="round" />
    <text class="node-label mono" x="908" y="98">API</text>
  </g>

  <g class="node node-queue" filter="url(#shadow)">
    <rect x="1033" y="174" width="76" height="62" rx="12" fill="var(--surface)" stroke="var(--border)" />
    <rect x="1047" y="189" width="46" height="6" rx="3" fill="var(--accent-blue)" opacity="0.72" />
    <rect x="1047" y="202" width="35" height="6" rx="3" fill="var(--border)" />
    <rect x="1047" y="215" width="42" height="6" rx="3" fill="var(--border-soft)" />
    <text class="node-label mono" x="1033" y="164">QUEUE</text>
  </g>

  <g class="node node-data" filter="url(#shadow)">
    <rect x="1035" y="248" width="75" height="50" rx="12" fill="var(--surface)" stroke="var(--border)" />
    <ellipse cx="1072.5" cy="263" rx="22" ry="7" fill="var(--surface-strong)" stroke="var(--accent-cool)" stroke-opacity="0.6" />
    <path d="M1050.5 263v14c0 4 10 7 22 7s22-3 22-7v-14" fill="none" stroke="var(--accent-cool)" stroke-opacity="0.6" />
    <text class="node-label mono" x="1035" y="316">DATA</text>
  </g>

  <g class="node node-deploy" filter="url(#shadow)">
    <rect x="1060" y="35" width="154" height="54" rx="12" fill="var(--surface)" stroke="var(--border)" />
    <circle cx="1081" cy="62" r="5" fill="var(--accent-cool)" class="status-dot" />
    <text class="node-value mono" x="1097" y="59">PRODUCTION</text>
    <text class="node-meta mono" x="1097" y="73">HEALTHY / 200</text>
  </g>

  <g transform="translate(674 214)">
    <rect width="300" height="94" rx="12" fill="var(--surface)" stroke="var(--border)" />
    <text class="node-label mono" x="16" y="22">ENGINEERING FOCUS</text>
    <g class="metric metric-1">
      <text class="node-meta mono" x="16" y="44">AGENTS</text>
      <rect class="bar" x="93" y="37" width="154" height="7" rx="3.5" fill="var(--accent-cool)" opacity="0.75" />
      <text class="node-meta mono" x="261" y="44">LIVE</text>
    </g>
    <g class="metric metric-2">
      <text class="node-meta mono" x="16" y="64">PRODUCT</text>
      <rect class="bar" x="93" y="57" width="138" height="7" rx="3.5" fill="var(--accent-blue)" opacity="0.75" />
      <text class="node-meta mono" x="261" y="64">LIVE</text>
    </g>
    <g class="metric metric-3">
      <text class="node-meta mono" x="16" y="84">DELIVERY</text>
      <rect class="bar" x="93" y="77" width="146" height="7" rx="3.5" fill="var(--accent-warm)" opacity="0.78" />
      <text class="node-meta mono" x="261" y="84">LIVE</text>
    </g>
  </g>
</svg>
